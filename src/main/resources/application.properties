spring.application.name=costing-cafelab
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Spring DataSource (BD propia del microservicio Costing)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/cafelab_costing?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root}

# Spring Data JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.hibernate.naming.physical-strategy=com.cafemetrix.cafelab.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# OpenAPI
documentation.application.description=Microservicio Costing de CafeLab (analisis de eficiencia y rendimiento de lotes)
documentation.application.version=1.0.0

# JWT (mismo secret y expiracion que el monolitico para validar tokens emitidos por IAM)
authorization.jwt.secret=${JWT_SECRET:CafeLabLocalDevSecretKey2026MinimumLength32Chars}
authorization.jwt.expiration.days=7

# Cliente HTTP hacia el monolitico (para resolver email->userId y validar ownership del lote)
monolith.base-url=${MONOLITH_BASE_URL:http://localhost:8080}

# Flyway
spring.flyway.enabled=false
