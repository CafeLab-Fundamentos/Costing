spring.application.name=costing-cafelab

# PostgreSQL / Supabase (pooler :6543 = Supavisor)
# El tenant se identifica por el username "postgres.<project_ref>" (cargado desde .env).
# NO usar combinacion: username con tenant + "options=reference=..." se pisan
# y el pooler rechaza el handshake con "password authentication failed for user 'postgres'".
spring.datasource.url=jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:6543/postgres?pgbouncer=true&sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# Naming Strategy
spring.jpa.hibernate.naming.physical-strategy=com.cafemetrix.cafelab.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Hibernate + PgBouncer transaction-mode: evita warnings de LOB no contextuales
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Documentation
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# JWT
authorization.jwt.secret=${JWT_SECRET:CafeLabLocalDevSecretKey2026MinimumLength32Chars}
authorization.jwt.expiration.days=7

# Cliente HTTP hacia el monolitico (para resolver email->userId y validar ownership del lote)
monolith.base-url=${MONOLITH_BASE_URL:http://localhost:8080}

# Flyway
spring.flyway.enabled=false
