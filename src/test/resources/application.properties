spring.application.name=costing-cafelab
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

documentation.application.description=CafeLab Costing API Test
documentation.application.version=1.0.0

# JWT (test fixture)
authorization.jwt.secret=CafeLabLocalDevSecretKey2026MinimumLength32Chars
authorization.jwt.expiration.days=7

# Monolith client (no se usa en tests; placeholder valido para que el contexto cargue)
monolith.base-url=http://localhost:8080
