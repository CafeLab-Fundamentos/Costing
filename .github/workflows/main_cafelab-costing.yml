# Build & deploy del microservicio Costing al Web App de Azure: cafelab-costing
# Usa publish profile como metodo de autenticacion (mas simple y robusto que OIDC).
#
# Requisitos:
#   1. En Azure Portal -> Web App "cafelab-costing" -> arriba "Descargar perfil de publicacion"
#   2. Copiar el contenido completo del .PublishSettings descargado.
#   3. En GitHub: Settings -> Secrets and variables -> Actions -> New repository secret
#      Nombre exacto: AZUREAPPSERVICE_PUBLISHPROFILE_CAFELAB_COSTING
#      Valor: pegar el XML completo del publish profile.
#   4. Push a main (o "Run workflow" manual desde la pestania Actions).

name: Build and deploy JAR app to Azure Web App - cafelab-costing

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17 (Microsoft Build of OpenJDK)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: '${{ github.workspace }}/target/*.jar'

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'cafelab-costing'
          slot-name: 'Production'
          package: '*.jar'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_CAFELAB_COSTING }}
